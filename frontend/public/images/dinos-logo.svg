<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 170" width="100%" height="100%" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">DINOS Pizzaria wordmark com garra</title>
  <desc id="desc">Logo wordmark DINOS Pizzaria com a letra O em formato de pizza e marcas de garra jurássica.</desc>

  <defs>
    <filter id="goldGlow" x="-20%" y="-35%" width="140%" height="170%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 1  0 1 0 0 0.62  0 0 1 0 0.08  0 0 0 0.75 0" result="goldBlur" />
      <feMerge>
        <feMergeNode in="goldBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.62" />
    </filter>

    <linearGradient id="letterGold" x1="44" y1="44" x2="260" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE0A3" />
      <stop offset="30%" stop-color="#FFAE19" />
      <stop offset="70%" stop-color="#D88924" />
      <stop offset="100%" stop-color="#B86B4B" />
    </linearGradient>

    <linearGradient id="emberStroke" x1="28" y1="30" x2="292" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFAE19" />
      <stop offset="54%" stop-color="#B86B4B" />
      <stop offset="100%" stop-color="#B33927" />
    </linearGradient>

    <radialGradient id="pizzaFill" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#FFD27A" />
      <stop offset="62%" stop-color="#FFAE19" />
      <stop offset="100%" stop-color="#B86B4B" />
    </radialGradient>

    <radialGradient id="ovenGlow" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#FFAE19" stop-opacity="0.28" />
      <stop offset="58%" stop-color="#B33927" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#121212" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect x="8" y="14" width="304" height="142" rx="42" fill="#121212" filter="url(#softShadow)" />
  <rect x="11" y="17" width="298" height="136" rx="39" fill="url(#ovenGlow)" />
  <rect x="15" y="21" width="290" height="128" rx="36" stroke="url(#emberStroke)" stroke-width="4" />
  <path d="M35 129 C82 151 238 151 285 129" stroke="#FFAE19" stroke-opacity="0.34" stroke-width="4" stroke-linecap="round" />

  <!-- Claw marks -->
  <g stroke="#B33927" stroke-width="7" stroke-linecap="round" filter="url(#goldGlow)">
    <path d="M244 34 C235 52 229 68 220 88" />
    <path d="M263 35 C254 55 247 74 238 96" />
    <path d="M282 42 C272 61 265 80 255 103" />
  </g>
  <g stroke="#FFAE19" stroke-width="2.2" stroke-linecap="round" opacity="0.72">
    <path d="M244 34 C235 52 229 68 220 88" />
    <path d="M263 35 C254 55 247 74 238 96" />
    <path d="M282 42 C272 61 265 80 255 103" />
  </g>

  <!-- DIN S letters -->
  <g filter="url(#goldGlow)" aria-hidden="true">
    <text x="30" y="100" font-family="Montserrat, Arial Black, Arial, sans-serif" font-size="68" font-weight="900" letter-spacing="-4" fill="url(#letterGold)" stroke="#121212" stroke-width="4" paint-order="stroke fill">DIN</text>
    <text x="204" y="100" font-family="Montserrat, Arial Black, Arial, sans-serif" font-size="68" font-weight="900" letter-spacing="-4" fill="url(#letterGold)" stroke="#121212" stroke-width="4" paint-order="stroke fill">S</text>
  </g>

  <!-- Pizza O -->
  <g filter="url(#goldGlow)">
    <circle cx="181" cy="75" r="35" fill="#121212" stroke="#FFAE19" stroke-width="5" />
    <circle cx="181" cy="75" r="26" fill="url(#pizzaFill)" stroke="#FFE0A3" stroke-width="2.5" />
    <path d="M181 75 L201 57 A26 26 0 0 0 168 52 Z" fill="#B33927" opacity="0.92" />
    <circle cx="174" cy="70" r="4.2" fill="#B33927" />
    <circle cx="189" cy="82" r="4" fill="#B33927" />
    <circle cx="181" cy="91" r="3.4" fill="#B33927" />
    <path d="M161 77 C171 82 184 82 199 74" stroke="#FFE0A3" stroke-opacity="0.62" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Dinosaur tooth underline -->
  <g fill="#FFAE19" opacity="0.92">
    <path d="M58 111 L66 126 L74 111 Z" />
    <path d="M82 113 L89 126 L97 113 Z" />
    <path d="M221 113 L229 126 L236 113 Z" />
    <path d="M244 111 L252 126 L260 111 Z" />
  </g>

  <text x="160" y="137" text-anchor="middle" font-family="Inter, Montserrat, Arial, sans-serif" font-size="17" font-weight="900" letter-spacing="7" fill="#F4E8D0">PIZZARIA</text>
</svg>
